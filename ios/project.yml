name: ActionHub
options:
  bundleIdPrefix: li.taurusag
  deploymentTarget:
    iOS: "17.0"
targets:
  ActionHub:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Sounds
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: actionhub
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Streams your voice to the transcription service while dictating.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: li.taurusag.actionhub
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
